[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dop-cmd"
version = "0.7.1"
description = "DevOps Pipeline CLI - IA-First unified tooling (git+PR, docker-compose runtime, e2e, reports)"
requires-python = ">=3.11"
dependencies = [
    "PyGithub>=2.0",
    "python-gitlab>=4.0",
]

[project.scripts]
dop = "dop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
