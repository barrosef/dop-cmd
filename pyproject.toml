[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dop-cmd"
version = "1.0.0"
description = "dop - operates the project's local environment from a dop.toml (up, down, status, logs, test, reset)"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
dop = "dop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
